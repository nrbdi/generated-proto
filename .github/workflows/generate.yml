name: Generate Proto Files

on:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Proto Files Repository
        run: git clone https://github.com/nrbdi/protos.git

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install protoc-gen-go and protoc-gen-go-grpc
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Generate Go Code from Proto Files
        run: |
          mkdir -p generated-proto/payment
          mkdir -p generated-proto/order
          cd protos
          protoc \
            --go_out=../generated-proto/payment \
            --go_opt=paths=source_relative \
            --go-grpc_out=../generated-proto/payment \
            --go-grpc_opt=paths=source_relative \
            payment/payment.proto
          protoc \
            --go_out=../generated-proto/order \
            --go_opt=paths=source_relative \
            --go-grpc_out=../generated-proto/order \
            --go-grpc_opt=paths=source_relative \
            order/order.proto

      - name: Clone Generator Repository
        run: |
          git clone https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/nrbdi/generated-proto.git cloned-gen

      - name: Copy generated files
        run: |
          cp -r generated-proto/payment/. cloned-gen/payment/
          cp -r generated-proto/order/. cloned-gen/order/

      - name: Push generated files
        run: |
          cd cloned-gen
          git config user.name "nrbdi"
          git config user.email "nurbaulydinara@gmail.com"
          git add .
          git diff --staged --quiet || git commit -m "chore: regenerate proto files"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/nrbdi/generated-proto.git main
